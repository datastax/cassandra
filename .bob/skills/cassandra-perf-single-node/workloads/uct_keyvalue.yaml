# Copied from the cassandra-upgrade-tester project (workloads/uct_keyvalue.yaml).

min_version: "5.21"
description: |
  cassandra-upgrade-tester key/value workload (NoSQLBench 5, cqld4 adapter).
  Keyspace uct_perf (NetworkTopologyStrategy, dc -> rf), table kv (key text PRIMARY KEY, value text).
  Blocks (select with tags=block:<name>): schema, schema-truncate, rampup, main-read, main-write,
  main-mixed (50/50), main-read is also used for the read-under-compaction step.
  Template params (name=value on the command line, defaults in parentheses):
    keyspace (uct_perf), dc (dc1, the datacenter named in the replication map; keep equal to the
    driver's localdc), rf (3), keycount (200000), value_size (100), op_timeout (10 seconds).
  Driver params (cqld4): hosts, localdc, port, username/password or userfile/passfile, ssl=jdk|openssl,
  truststore/tspass, driverconfig=<file>. The driver is given on the command line (driver=cqld4) so
  that the same file can be rendered with driver=stdout for validation.

scenarios:
  default:
    schema: run driver=cqld4 tags==block:schema threads==1 alias=schema
    rampup: run driver=cqld4 tags==block:rampup cycles=TEMPLATE(keycount,200000) threads=auto alias=rampup
    main-read: run driver=cqld4 tags==block:main-read cycles=TEMPLATE(main_cycles,120000) threads=auto alias=main_read
    main-write: run driver=cqld4 tags==block:main-write cycles=TEMPLATE(main_cycles,120000) threads=auto alias=main_write
    main-mixed: run driver=cqld4 tags==block:main-mixed cycles=TEMPLATE(main_cycles,120000) threads=auto alias=main_mixed
  truncate:
    truncate: run driver=cqld4 tags==block:schema-truncate threads==1 alias=truncate

bindings:
  # rampup: every key exactly once, value ~value_size bytes of printable text
  seq_key: Mod(TEMPLATE(keycount,200000)L); ToString() -> String
  seq_value: Hash(); AlphaNumericString(TEMPLATE(value_size,100)) -> String
  # main: uniformly random keys inside the loaded population, values never repeat
  rw_key: Uniform(0,TEMPLATE(keycount,200000)); ToString() -> String
  rw_value: Hash(); AlphaNumericString(TEMPLATE(value_size,100)) -> String

blocks:
  schema:
    params:
      timeout: 60
    ops:
      create_keyspace:
        simple: |
          CREATE KEYSPACE IF NOT EXISTS TEMPLATE(keyspace,uct_perf)
          WITH replication = {'class': 'NetworkTopologyStrategy', 'TEMPLATE(dc,dc1)': 'TEMPLATE(rf,3)'}
          AND durable_writes = true;
      create_table:
        simple: |
          CREATE TABLE IF NOT EXISTS TEMPLATE(keyspace,uct_perf).kv (
            key text PRIMARY KEY,
            value text
          );

  schema-truncate:
    params:
      timeout: 600
    ops:
      truncate_kv:
        simple: TRUNCATE TABLE TEMPLATE(keyspace,uct_perf).kv;

  rampup:
    params:
      cl: LOCAL_QUORUM
      timeout: TEMPLATE(op_timeout,10)
      idempotent: true
    ops:
      rampup_insert:
        prepared: |
          INSERT INTO TEMPLATE(keyspace,uct_perf).kv (key, value) VALUES ({seq_key}, {seq_value});

  main-read:
    params:
      cl: LOCAL_QUORUM
      timeout: TEMPLATE(op_timeout,10)
      idempotent: true
    ops:
      read_select:
        prepared: |
          SELECT key, value FROM TEMPLATE(keyspace,uct_perf).kv WHERE key = {rw_key};

  main-write:
    params:
      cl: LOCAL_QUORUM
      timeout: TEMPLATE(op_timeout,10)
      idempotent: true
    ops:
      write_insert:
        prepared: |
          INSERT INTO TEMPLATE(keyspace,uct_perf).kv (key, value) VALUES ({rw_key}, {rw_value});

  main-mixed:
    params:
      cl: LOCAL_QUORUM
      timeout: TEMPLATE(op_timeout,10)
      idempotent: true
    ops:
      mixed_select:
        ratio: TEMPLATE(read_ratio,1)
        tags:
          optype: read
        prepared: |
          SELECT key, value FROM TEMPLATE(keyspace,uct_perf).kv WHERE key = {rw_key};
      mixed_insert:
        ratio: TEMPLATE(write_ratio,1)
        tags:
          optype: write
        prepared: |
          INSERT INTO TEMPLATE(keyspace,uct_perf).kv (key, value) VALUES ({rw_key}, {rw_value});
