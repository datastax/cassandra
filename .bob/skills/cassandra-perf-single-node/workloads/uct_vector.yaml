# Copied from the cassandra-upgrade-tester project (workloads/uct_vector.yaml).

min_version: "5.21"
description: |
  cassandra-upgrade-tester vector/ANN workload (NoSQLBench 5, cqld4 adapter). OPTIONAL, off by default
  (add 'vector' to the workloads list of perf-run.yml to enable it).
  Table uct_perf.vec (id int PRIMARY KEY, v vector<float, dimensions>) with a StorageAttachedIndex
  using similarity_function cosine. rampup writes keycount synthetic vectors, main-ann runs
  SELECT id FROM vec ORDER BY v ANN OF ? LIMIT ann_limit, main-write inserts rows beyond the rampup
  range, main-read is an alias of main-ann for the read-under-compaction step.
  Template params: keyspace (uct_perf), dc (dc1), rf (3), keycount (200000), dimensions (64),
  ann_limit (10), op_timeout (10 seconds).

scenarios:
  default:
    schema: run driver=cqld4 tags==block:schema threads==1 alias=schema
    rampup: run driver=cqld4 tags==block:rampup cycles=TEMPLATE(keycount,200000) threads=auto alias=rampup
    main-ann: run driver=cqld4 tags==block:main-ann cycles=TEMPLATE(main_cycles,120000) threads=auto alias=main_ann
    main-write: run driver=cqld4 tags==block:main-write cycles=TEMPLATE(main_cycles,120000) threads=auto alias=main_write
    main-read: run driver=cqld4 tags==block:main-read cycles=TEMPLATE(main_cycles,120000) threads=auto alias=main_read
  truncate:
    truncate: run driver=cqld4 tags==block:schema-truncate threads==1 alias=truncate

bindings:
  seq_id: Mod(TEMPLATE(keycount,200000)L); ToInt() -> int
  seq_vec: HashedFloatVectors(TEMPLATE(dimensions,64)); ToCqlVector()
  new_id: Add(TEMPLATE(keycount,200000)L); ToInt() -> int
  new_vec: Hash(); HashedFloatVectors(TEMPLATE(dimensions,64)); ToCqlVector()
  q_vec: Hash(); Hash(); HashedFloatVectors(TEMPLATE(dimensions,64)); ToCqlVector()

blocks:
  schema:
    params:
      timeout: 120
    ops:
      create_keyspace:
        simple: |
          CREATE KEYSPACE IF NOT EXISTS TEMPLATE(keyspace,uct_perf)
          WITH replication = {'class': 'NetworkTopologyStrategy', 'TEMPLATE(dc,dc1)': 'TEMPLATE(rf,3)'}
          AND durable_writes = true;
      create_table:
        simple: |
          CREATE TABLE IF NOT EXISTS TEMPLATE(keyspace,uct_perf).vec (
            id int PRIMARY KEY,
            v vector<float, TEMPLATE(dimensions,64)>
          );
      create_index:
        simple: |
          CREATE CUSTOM INDEX IF NOT EXISTS vec_v_idx ON TEMPLATE(keyspace,uct_perf).vec (v)
          USING 'StorageAttachedIndex' WITH OPTIONS = {'similarity_function': 'cosine'};

  schema-truncate:
    params:
      timeout: 600
    ops:
      truncate_vec:
        simple: TRUNCATE TABLE TEMPLATE(keyspace,uct_perf).vec;

  rampup:
    params:
      cl: LOCAL_QUORUM
      timeout: TEMPLATE(op_timeout,10)
      idempotent: true
    ops:
      rampup_insert:
        prepared: |
          INSERT INTO TEMPLATE(keyspace,uct_perf).vec (id, v) VALUES ({seq_id}, {seq_vec});

  main-ann:
    params:
      cl: LOCAL_QUORUM
      timeout: TEMPLATE(op_timeout,10)
      idempotent: true
    ops:
      ann_select:
        prepared: |
          SELECT id FROM TEMPLATE(keyspace,uct_perf).vec ORDER BY v ANN OF {q_vec} LIMIT TEMPLATE(ann_limit,10);

  main-write:
    params:
      cl: LOCAL_QUORUM
      timeout: TEMPLATE(op_timeout,10)
      idempotent: true
    ops:
      write_insert:
        prepared: |
          INSERT INTO TEMPLATE(keyspace,uct_perf).vec (id, v) VALUES ({new_id}, {new_vec});

  main-read:
    params:
      cl: LOCAL_QUORUM
      timeout: TEMPLATE(op_timeout,10)
      idempotent: true
    ops:
      read_ann_select:
        prepared: |
          SELECT id FROM TEMPLATE(keyspace,uct_perf).vec ORDER BY v ANN OF {q_vec} LIMIT TEMPLATE(ann_limit,10);
