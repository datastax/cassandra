# Helmfile for a ci-cassandra Jenkins cluster deployment
#
# Manages three releases in order:
#   1. cert-manager  — issues and renews the Let's Encrypt TLS certificate
#   2. cert-issuer   — ClusterIssuer + Certificate (depends on cert-manager CRDs)
#   3. cassius       — Jenkins controller + agents
#
# Usage:
#   helmfile apply          # install/upgrade all releases in order
#   helmfile apply -l name=cassius   # upgrade Jenkins only
#   helmfile destroy        # tear down all releases (PVC kept by helm.sh/resource-policy: keep)
#
# Prerequisites: helm, helmfile, kubectl, gcloud (authenticated + pointing at the cluster)
# Install helmfile:  brew install helmfile
# Install helm-diff: helm plugin install https://github.com/databus23/helm-diff
#                    (helm 3) or add --verify=false for helm 4

repositories:
  - name: jenkins
    url: https://charts.jenkins.io
  - name: jetstack
    url: https://charts.jetstack.io

releases:
  # ── 1. cert-manager ──────────────────────────────────────────────────────────
  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    # Pin to a known-good version; bump deliberately after reading the upgrade notes:
    # https://cert-manager.io/docs/release-notes/
    version: "~> v1.17"
    wait: true
    values:
      - cert-manager-values.yaml

  # ── 2. cert-issuer (ClusterIssuer + Certificate) ─────────────────────────────
  # A minimal local chart that wraps the two CRD resources cert-manager provides.
  # It must run after cert-manager so the CRDs exist.
  - name: cert-issuer
    namespace: default
    chart: ./charts/cert-issuer
    # Do not wait for the Certificate to become Ready here: issuance requires
    # the HTTP-01 challenge to succeed, which in turn requires the nginx sidecar
    # in Jenkins to be running and proxying /.well-known/acme-challenge/.
    # Jenkins is deployed in the next release; cert-manager will keep retrying
    # the challenge and the Certificate will become Ready once nginx is up.
    wait: false
    # disableValidation skips the CRD existence check during `helmfile diff`.
    # cert-manager.io CRDs (Certificate, ClusterIssuer) are not present until
    # the cert-manager release above has been applied, so helm-diff cannot
    # render this chart against the live cluster until after that first apply.
    disableValidation: true
    needs:
      - cert-manager/cert-manager
    values:
      - cert-issuer-values.yaml
      # Overrides hostname and acmeEmail from environment variables.
      # Set JENKINS_HOSTNAME and ACME_EMAIL before running helmfile.
      # See deploy.sh — it validates and exports both before invoking helmfile.
      - cert-issuer-env-values.yaml.gotmpl

  # ── 3. Jenkins ───────────────────────────────────────────────────────────────
  - name: cassius
    namespace: default
    chart: jenkins/jenkins
    # Track the latest patch of the current minor; bump deliberately at major bumps.
    version: "~> 5.9"
    wait: true
    timeout: 600
    needs:
      - default/cert-issuer
    values:
      # Shared upstream values (pod templates, plugins, JCasC, resource limits).
      # Do not edit this file for site-specific settings; add them to the override below.
      - ../jenkins-deployment.yaml
      # Site-specific overrides for this cluster (nginx sidecar, port 443, storage class, etc.):
      # nginx TLS sidecar, port 443 on the LoadBalancer service, storage class, etc.
      - jenkins-tls-overrides.yaml
