# Helm values for the jetstack/cert-manager release.
# https://artifacthub.io/packages/helm/cert-manager/cert-manager

# Install the cert-manager CRDs as part of this Helm release so that
# `helm upgrade` keeps them in sync with the chart version.
crds:
  enabled: true

# Pin cert-manager to the controller node so the agent pools (which scale to
# zero between builds) do not evict it mid-renewal.
nodeSelector:
  cassandra.jenkins.controller: "true"

# Minimal resource requests; cert-manager is idle except during issuance/renewal.
resources:
  requests:
    cpu: 10m
    memory: 64Mi

webhook:
  nodeSelector:
    cassandra.jenkins.controller: "true"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

cainjector:
  nodeSelector:
    cassandra.jenkins.controller: "true"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
