#
# Values for the local charts/cert-issuer chart.

# The email address Let's Encrypt uses for expiry warnings.
# Set via environment variable or edit before deploying.
# Example: export ACME_EMAIL=you@example.com
acmeEmail: ""   # set ACME_EMAIL env var, or edit this value

# The hostname the TLS certificate is issued for.
# Must match the DNS name resolving to this cluster's load balancer.
# Example: export JENKINS_HOSTNAME=ci-cassandra.example.com
hostname: ""    # set JENKINS_HOSTNAME env var, or edit this value

# Name of the Kubernetes Secret that cert-manager writes the certificate into.
# Referenced by the nginx sidecar in jenkins-tls-overrides.yaml.
secretName: "cassius-jenkins-tls"
